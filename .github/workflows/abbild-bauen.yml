name: Abbild bauen

# Baut das fertige Abbild und legt es in der Registry ab. Gebaut wird
# ausserdem die Pruefung der Fingerabdruecke der Netzgewichte (im Dockerfile):
# weicht eine Datei ab, bricht der Bau ab.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bauen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Bauwerkzeug einrichten
        uses: docker/setup-buildx-action@v3

      - name: An der Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Abbild bauen und schieben
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/mekotools/maschine-lernt:latest
            ghcr.io/mekotools/maschine-lernt:${{ github.sha }}

      - name: Kennwerte melden
        run: |
          echo "Gebaut: ghcr.io/mekotools/maschine-lernt:${{ github.sha }}"
          docker buildx imagetools inspect ghcr.io/mekotools/maschine-lernt:latest || true
