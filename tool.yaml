      referenz: "ghcr.io/mekotools/maschine-lernt:latest"
      sichtbarkeit: public
      geprueft_am: "2026-10-06"
  dienst_url: "https://maschine-lernt.mekotools.de"
  port: 80
  quellcode: "https://git.n0ne.de/mekotools/maschine-lernt"
  lizenz: "MIT"
  lizenz_link: "https://git.n0ne.de/mekotools/maschine-lernt/src/branch/main/LICENSE"

