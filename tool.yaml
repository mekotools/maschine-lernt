# Metadaten des MekoTools-Werkzeugs "Maschine lernt".
# Schema: schema/tool.schema.json im Repo mekotools-katalog.

schema_version: 1

id: maschine-lernt
titel: "Maschine lernt"
kurzbeschreibung: "Kamera oder Bilddateien zeigen, Klassen anlegen, Beispiele aufnehmen — und die Maschine urteilt sofort mit. Zwei Betriebsarten: Motive und Körperhaltungen. Alles im Browser, ohne Konto."

themen: [ki]
unterthemen: [ki/bild]

laufzeit: browser
betrieb: eigen

reifegrad: beta
aufwand_lehrkraft: niedrig
zielgruppe: [sek1, sek2, berufsschule, erwachsene]

bildungsbezug:
  kompetenzen: [analysieren-reflektieren, problemloesen-handeln]
  faecher: [informatik, naturwissenschaften, kunst]
  lernziele:
    - "Die Lernenden können erklären, dass eine Maschine nur aus Beispielen lernt und nicht 'weiss', was ein Apfel ist."
    - "Die Lernenden können begründet vorhersagen, wie sich eine einseitige oder zu kleine Beispielsammlung auf das Urteil auswirkt."
    - "Die Lernenden können an einem eigenen Modell prüfen, ob ein Urteil belastbar ist, und die Grenzen benennen."

technik:
  artefakte:
